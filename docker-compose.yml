services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n_cv_projesi
    ports:
      - "${N8N_PORT}:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - GENERIC_TIMEZONE=${TIMEZONE}
      - WEBHOOK_URL=http://localhost:${N8N_PORT}/

volumes:
  n8n_data:


